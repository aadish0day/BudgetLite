name: budget_lite
description: A premium offline-first personal budgeting app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Charts
  fl_chart: ^0.70.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Icons
  lucide_icons_flutter: ^3.1.15

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.2

  # CSV & PDF export
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^13.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  file_picker: ^12.0.0
  quick_actions: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/vector_app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/vector_app_icon.png"
    background_color: "#0F171E"
    theme_color: "#0D7377"

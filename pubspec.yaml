name: budget_lite
description: A premium offline-first personal budgeting app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  csv: ^6.0.0
  drift: ^2.26.0
  file_picker: ^12.0.0
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.0
  google_fonts: ^6.2.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  local_auth: ^3.0.2
  lucide_icons_flutter: ^3.1.15
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.1
  permission_handler: ^12.0.3
  printing: ^5.13.2
  quick_actions: ^1.0.7
  share_plus: ^13.3.0
  sqlite3: ^2.7.4
  sqlite3_flutter_libs: ^0.5.28
  timezone: ^0.9.4
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/vector_app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/vector_app_icon.png"
    background_color: "#0F171E"
    theme_color: "#0D7377"
